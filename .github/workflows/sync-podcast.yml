name: Sync podcast episodes

# Checks the podcast RSS feed every 6 hours; when there is a new or edited episode,
# rebuilds the /podcast/ pages and commits them, which redeploys the site.
# Run it by hand any time from the repo's Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-podcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync episodes from the RSS feed
        run: python3 scripts/sync-podcast.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain podcast sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add podcast sitemap.xml
            git commit -m "Sync podcast episodes from RSS"
            git push
          else
            echo "No podcast changes."
          fi
