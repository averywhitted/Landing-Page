<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Sessions | Avery Whitted</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://book.averywhitted.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/podcast/podcast.css" />
    <link rel="stylesheet" href="/book/booking.css?v=455e7e29" />
    <style>
      .pk { margin-top: 32px; padding: 40px 44px; max-width: 820px; }
      .pk .show-title { margin-bottom: 12px; }
      .pk-meter { display: flex; align-items: center; gap: 18px; margin: 22px 0 8px; padding: 18px 20px; border-radius: 16px; background: var(--bg1); }
      .pk-count { font-family: var(--display); font-size: 2.75rem; line-height: 1; }
      .pk-count small { font-family: var(--body); font-size: 0.875rem; font-weight: 600; color: var(--muted); margin-left: 6px; }
      .pk-dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .pk-dot { width: 14px; height: 14px; border-radius: 999px; background: var(--a); }
      .pk-dot.used { background: transparent; border: 2px solid var(--line); }
      .pk-sub { font-family: var(--mono); letter-spacing: -0.03em; font-size: 0.8125rem; color: var(--faint); }
      .pk h2 { margin: 30px 0 12px; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
      .pk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .pk-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
      .pk-item strong { display: block; font-size: 0.9375rem; }
      .pk-item span { font-family: var(--mono); letter-spacing: -0.03em; font-size: 0.8125rem; color: var(--faint); }
      .pk-item.is-muted { background: transparent; border-style: dashed; }
      .pk-item a { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--a); }
      .pk-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .pk-focus { margin-top: 20px; }
      .pk-focus label { display: block; margin: 0 0 6px; font-size: 0.75rem; font-weight: 600; }
      .pk-focus label span { font-weight: 500; color: var(--faint); }
      .pk-focus textarea { width: 100%; min-height: 72px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; font-family: var(--mono); font-size: 0.875rem; letter-spacing: -0.02em; resize: vertical; }
      .pk-focus textarea:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px var(--a-soft); }
      .pk-note { margin: 16px 0 0; font-family: var(--mono); letter-spacing: -0.03em; font-size: 0.8125rem; line-height: 1.6; color: var(--faint); }
      .pk-note a, .pk-msg a { color: var(--a); text-decoration: underline; text-underline-offset: 3px; }
      .pk-msg { margin: 0 0 20px; padding: 14px 16px; border-radius: 12px; font-size: 0.9062rem; line-height: 1.5; }
      .pk-msg.ok { background: var(--lime); color: var(--lime-ink); font-weight: 600; }
      .pk-msg.err { background: #fdecea; color: #8a1c12; }
      .pk-actions[hidden] { display: none; }
      .pk-wait { display: flex; align-items: center; gap: 12px; font-family: var(--mono); letter-spacing: -0.03em; color: var(--muted); }
      .pk-wait .bk-spin { width: 18px; height: 18px; color: var(--a); }
      @media (max-width: 640px) {
        .pk { padding: 26px 20px; margin-top: 22px; }
        .pk-actions .btn { flex: 1 1 100%; }
      }
    </style>
    <script>document.documentElement.classList.add("js");</script>
    <script src="/book/booking.js?v=7229e586" defer></script>
  </head>

  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <a href="/">
            <span class="brand-name">Avery Whitted</span>
            <span class="brand-sub">Acting Workshops + Private Coaching</span>
          </a>
        </div>
        <nav aria-label="Site">
          <a class="pill" href="/">Home</a>
          <a class="pill" href="/podcast/">Podcast</a>
        </nav>
      </header>

      <main>
        <section class="panel pk" id="pk" aria-live="polite">
          <p class="tag">Your sessions</p>
          <h1 class="show-title">One moment</h1>
          <p class="pk-wait"><span class="bk-spin" aria-hidden="true"></span>Loading your bundle...</p>
        </section>
      </main>

      <footer class="footer">
        <div>&copy; <span id="year"></span> Avery Whitted &middot; <a class="footer-link" href="/">Home</a> &middot; <a class="footer-link" href="/policies.html">Policies</a></div>
      </footer>
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      window.addEventListener("DOMContentLoaded", () => {
        const API = (window.AWBooking && window.AWBooking.api) || "https://book.averywhitted.com";
        const CONTACT = "info@averywhitted.com";
        const q = new URLSearchParams(location.search);
        const p = q.get("p") || "";
        const t = q.get("t") || "";
        const $ = document.getElementById("pk");
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        let pkg = null;
        let flash = null;

        const tz = () => { try { return localStorage.getItem("bk-tz") || pkg.timeZone; } catch { return pkg.timeZone; } };
        const f = (ms, o) => new Intl.DateTimeFormat("en-US", { timeZone: tz(), ...o }).format(ms);
        const zone = (ms) => new Intl.DateTimeFormat("en-US", { timeZone: tz(), timeZoneName: "short" }).formatToParts(ms).find((x) => x.type === "timeZoneName")?.value || "";
        const longDay = (ms) => f(ms, { weekday: "long", month: "long", day: "numeric" });
        const when = (iso) => `${f(Date.parse(iso), { weekday: "short", month: "short", day: "numeric" })}, ${f(Date.parse(iso), { hour: "numeric", minute: "2-digit" })} ${zone(Date.parse(iso))}`;

        function show(tag, title, html) {
          $.innerHTML = `<p class="tag">${esc(tag)}</p><h1 class="show-title">${esc(title)}</h1>`
            + (flash ? `<p class="pk-msg ${flash.kind}" role="${flash.kind === "err" ? "alert" : "status"}">${flash.html}</p>` : "") + html;
          flash = null;
        }

        async function api(method, path, body) {
          const r = await fetch(`${API}${path}`, {
            method, cache: "no-store",
            headers: body ? { "Content-Type": "application/json" } : undefined,
            body: body ? JSON.stringify(body) : undefined,
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) { const err = new Error(data.error || "Something went wrong. Please try again."); err.status = r.status; throw err; }
          return data;
        }

        async function load() {
          try {
            pkg = await api("GET", `/api/packages?p=${encodeURIComponent(p)}&t=${encodeURIComponent(t)}`);
            render();
          } catch (err) {
            show("Your sessions", "Link not recognized",
              `<div class="prose"><p>${esc(err.status === 404 ? err.message : "We couldn't load your bundle right now. Please try again in a moment.")}</p>
               <p>Need help? Email <a href="mailto:${CONTACT}" style="color:var(--a)">${CONTACT}</a>.</p></div>`);
          }
        }

        function sessionsHtml() {
          if (!pkg.sessions.length) return "";
          const upcoming = pkg.sessions.filter((s) => s.status === "upcoming");
          const other = pkg.sessions.filter((s) => s.status !== "upcoming");
          const item = (s) => `<li class="pk-item${s.status === "upcoming" ? "" : " is-muted"}">
              <div><strong>${esc(when(s.start))}</strong><span>${s.status === "upcoming" ? `1 hour on Zoom` : s.status === "past" ? "Done" : "Cancelled, returned to your bundle"}</span></div>
              ${s.manageUrl ? `<a href="${esc(s.manageUrl)}">Reschedule or cancel</a>` : ""}
            </li>`;
          return (upcoming.length ? `<h2>Upcoming</h2><ul class="pk-list">${upcoming.map(item).join("")}</ul>` : "")
            + (other.length ? `<h2>Earlier</h2><ul class="pk-list">${other.map(item).join("")}</ul>` : "");
        }

        function render() {
          if (pkg.status === "processing") {
            return show("Your sessions", "Almost there", `<div class="prose"><p>Your payment is still being confirmed. Give it a minute and refresh this page.</p></div>`);
          }
          if (pkg.status === "cancelled") {
            return show("Your sessions", "This bundle isn't active", `<div class="prose"><p>Questions? Email <a href="mailto:${CONTACT}" style="color:var(--a)">${CONTACT}</a>.</p></div>`);
          }
          const used = pkg.credits - pkg.remaining;
          const dots = Array.from({ length: pkg.credits }, (_, i) => `<span class="pk-dot${i < used ? " used" : ""}"></span>`).join("");
          const useBy = pkg.expiresAt ? longDay(Date.parse(pkg.expiresAt)) : "";
          const meter = `<div class="pk-meter" aria-label="${pkg.remaining} of ${pkg.credits} sessions left">
              <div class="pk-count">${pkg.remaining}<small>of ${pkg.credits} left</small></div>
              <div><div class="pk-sub">${esc(pkg.bundleName)} &middot; ${pkg.status === "expired" ? "expired" : `use by ${esc(useBy)}`}</div><div class="pk-dots" aria-hidden="true">${dots}</div></div>
            </div>`;
          let actions = "";
          if (pkg.canBook) {
            actions = `<div class="pk-actions" id="pk-actions"><button type="button" class="btn primary" id="pk-book">Book a session</button></div><div id="pk-extra"></div>`;
          } else if (pkg.status === "expired") {
            actions = `<p class="pk-note">This bundle's use-by date has passed. If something got in the way, email <a href="mailto:${CONTACT}">${CONTACT}</a> and we'll talk.</p>`;
          } else {
            actions = `<p class="pk-note">You've booked every session in this bundle. Want more? <a href="/book/">Book another session or bundle</a>.</p>`;
          }
          const hi = pkg.firstName ? `Hi ${pkg.firstName}` : "Your sessions";
          show("Your sessions", hi, meter + actions + sessionsHtml()
            + `<p class="pk-note">Each session can be rescheduled or cancelled up to 24 hours before it starts, and it goes back into your bundle.</p>`);
          document.getElementById("pk-book")?.addEventListener("click", openPicker);
        }

        function openPicker() {
          document.getElementById("pk-actions").hidden = true;
          const holder = document.getElementById("pk-extra");
          holder.innerHTML = `<div class="pk-focus"><label for="pk-focus-text">Anything specific you want to focus on? <span>(optional)</span></label>
              <textarea id="pk-focus-text" maxlength="2000" placeholder="New sides for a callback, a self-tape, a monologue..."></textarea></div>
            <div class="mg-picker" id="pk-picker" style="margin-top:18px"></div>`;
          window.AWBooking.mountPicker(document.getElementById("pk-picker"), {
            serviceId: pkg.serviceId,
            timeZone: pkg.timeZone,
            title: "Pick a time",
            summaryHtml: `<div class="bk-summary"><strong>Booking 1 of your ${pkg.remaining} remaining session${pkg.remaining === 1 ? "" : "s"}</strong><span class="bk-sep">&middot;</span><span>1 hour on Zoom</span><span class="bk-price" style="font-size:0.8125rem;font-family:inherit">No payment needed</span></div>`,
            confirmLabel: "Book this time",
            busyLabel: "Booking",
            cancelLabel: "Not now",
            onCancel: render,
            async onConfirm(slot) {
              const focus = document.getElementById("pk-focus-text")?.value || "";
              await api("POST", "/api/packages/book", { p, t, start: new Date(slot).toISOString(), focus });
              flash = { kind: "ok", html: "Booked. A confirmation email with your Zoom link and a calendar invite is on its way." };
              await load();
              window.scrollTo({ top: 0, behavior: "smooth" });
            },
          });
          holder.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        load();
      });
    </script>
  </body>
</html>
